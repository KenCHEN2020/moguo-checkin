<title>果子登记</title>
<style>
:root{
--bg:#F5F7F2;--card:#fff;--line:#E5EAE0;--ink:#20302A;--muted:#718077;
--brand:#E2703A;--ok:#2E9E6B;--ok-bg:#E8F6EE;--warn:#B4692C;--warn-bg:#FDF1E7;--gray-bg:#F0F2EE;
/* 常用配色：改 # 后面的 6 位色值即可，改完重新发布 */
--c-pick-done:#2E9E6B;   /* 已摸满 大块 */
--c-plant-btn:#185FA5;   /* 种果了 按钮 */
--c-plant-done:#6B46C1;  /* 已种果 大块 */
--c-done-bg:#EAF7F0;--c-done-bd:#8FD3AE;  /* 全部完成 底色/边框 */
--c-todo-bg:#FDF0F0;--c-todo-bd:#EDA9A9;  /* 两项待办 底色/边框 */
--c-none-bg:#FFFAF4;--c-none-bd:#EFD6B8   /* 没摸到 底色/边框 */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 56px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:15px;font-weight:600;margin:0 0 12px}
.sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input[type=date],input[type=text],textarea{width:100%;border:1px solid var(--line);background:#FBFCFA;border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink);font-family:inherit;outline:none}
input[type=date]{width:auto;min-width:150px}
input[type=text]{flex:1;min-width:120px}
textarea{resize:vertical;line-height:1.6;margin-top:10px}
input:focus,textarea:focus{border-color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.go{background:var(--brand);border-color:var(--brand);color:#fff;padding:10px 22px}
.btn.plant{background:var(--c-plant-btn);border-color:var(--c-plant-btn);color:#fff;padding:10px 16px}
.btn[disabled]{opacity:.55}
.stats{display:flex;gap:10px;margin:16px 0 12px}
.stat{flex:1;background:var(--gray-bg);border-radius:12px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)}
.stat.warn b{color:var(--warn)}
.bar{height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden}
.bar div{height:100%;background:var(--ok);width:0;transition:width .3s}
.plantstat{font-size:12px;color:var(--ok);margin-top:10px}
.pending{margin-top:14px;background:#FBFCFA;border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.7;word-break:break-all}
.share{background:#FBFCFA;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:12px;word-break:break-all;line-height:1.6;color:var(--muted);margin-bottom:10px}
.search{width:100%;border:1px solid var(--line);background:#FBFCFA;border-radius:10px;padding:12px;font-size:15px;color:var(--ink);font-family:inherit;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:11px}
.mitem,.arow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:118px}
.mitem.mine{box-shadow:inset 3px 0 0 var(--brand)}
.mitem.c-all-done{background:var(--c-done-bg);border-color:var(--c-done-bd)}
.mitem.c-all-todo{background:var(--c-todo-bg);border-color:var(--c-todo-bd)}
.mitem.c-none{background:var(--c-none-bg);border-color:var(--c-none-bd)}
.arow{min-height:108px}
.arow.c-all-done{background:var(--c-done-bg);border-color:var(--c-done-bd)}
.arow.c-all-todo{background:var(--c-todo-bg);border-color:var(--c-todo-bd)}
.arow.c-none{background:var(--c-none-bg);border-color:var(--c-none-bd)}
.arow.sel{border-color:var(--brand);background:#FFFCF9}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-height:20px;flex-wrap:wrap}
.mname{font-size:15px;font-weight:600;word-break:break-all;line-height:1.35;margin-top:8px;flex:1}
.mactions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mactions .btn.go,.mactions .btn.plant{flex:1;min-width:62px;padding:9px 6px;font-size:13px;text-align:center}
.mactions .mini{flex:1;min-width:54px;padding:8px 6px;font-size:12px;text-align:center}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.psec{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);flex-wrap:wrap}
.plabel{font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:400;padding:3px 6px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.gray{background:var(--gray-bg);color:var(--muted)}
.badge.todo{background:#FCEBEB;color:#A32D2D}
.doneflag{width:100%;background:var(--c-pick-done);color:#fff;border-radius:10px;padding:12px 8px;font-size:16px;font-weight:600;text-align:center}
.plantdone{width:100%;background:var(--c-plant-done);color:#fff;border-radius:10px;padding:12px 8px;font-size:16px;font-weight:600;text-align:center}
.mini.tiny{padding:3px 8px;font-size:11px}
.mfoot{margin-top:auto;padding-top:9px;display:flex;justify-content:flex-end}
.pickme{border:0;background:transparent;padding:2px 0;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;line-height:1.3;white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.pickme:active{color:var(--brand)}
.pickme.meclear{color:var(--brand);background:var(--warn-bg);border:1px solid #EFD6B8;border-radius:6px;padding:2px 7px;text-decoration:none}
.shothead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.shothead .shotlabel{font-size:13px;color:var(--muted)}
.shotclose{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.shotclose:active{background:#F0F2EE}
.shotimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:10px}
.codeitem{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.codeitem:first-child{border-top:0;padding-top:2px}
.codetext{flex:1;min-width:130px;font-size:14px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chk input{width:15px;height:15px;accent-color:var(--brand);margin:0}
.note{font-size:12px;color:var(--muted);line-height:1.8;padding:4px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(12px);background:#20302A;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.erricon{width:44px;height:44px;border-radius:50%;background:var(--gray-bg);color:var(--muted);font-size:22px;line-height:44px;margin:0 auto 12px}
</style>

<script>window.APP_CONFIG = {
  backend: 'supabase',              // 'workbuddy' 用自家云服务；'supabase' 用 Supabase 免费后端
  supabaseUrl: 'https://cfzjruwccstqvrwhszse.supabase.co',
  supabaseKey: 'sb_publishable_OXrxM7iPK9SRBhZ59Vlcwg_Nq6lArlk',
  endpoint:'https://fruit-checkin-24663.app.workbuddy.host',
  oauthRelayBaseUrl:'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
  publishableKey:'wbpk_FhVhWR0wyX8IHi5ekShOMe_3liyZXB3V2g5Nj5x767hHOP5FLW344Lg',
  adminKey:'mg-a7f3kq9z2'
};</script>
<script>
(function(){
  var CFG = window.APP_CONFIG || {};
  var app = document.getElementById('app');
  var db = null;
  var isAdmin = false;
  var state = { members: [], rows: [], plants: [], codes: [], day: '' };
  var selected = {};
  var KEEP_DAYS = 30;          // 保留最近几天（含今天）的摸果/种果记录，更早的会被自动删除；改成 3 就保留今天和前 2 天
  var CLEAN_KEY = 'moguo_cleanup_on';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function today(){ return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10); }
  function dayStr(offset){
    var d = new Date(Date.now() + 8 * 3600 * 1000 - (offset || 0) * 86400000);
    return d.toISOString().slice(0, 10);
  }
  function keepFrom(){ return dayStr(KEEP_DAYS - 1); }   // 这一天及之后的记录保留
  function lastClean(){
    try { return localStorage.getItem(CLEAN_KEY) || ''; } catch(e){ return ''; }
  }
  async function cleanupOld(){
    var cut = keepFrom();
    var c1 = await q(db.from('checkins').delete().lt('day', cut).select());
    var c2 = await q(db.from('plantings').delete().lt('day', cut).select());
    var r = { cut: cut, checkins: (c1 || []).length, plantings: (c2 || []).length };
    try { localStorage.setItem(CLEAN_KEY, today()); } catch(e){}
    return r;
  }
  async function autoCleanup(){
    try {
      if(lastClean() === today()) return;   // 今天已经清过
      await cleanupOld();
    } catch(e){}
  }
  function prettyDay(d){ var p = String(d).split('-'); return (p[1]||'').replace(/^0/,'') + '月' + (p[2]||'').replace(/^0/,'') + '日'; }
  function timeStr(iso){
    if(!iso) return '';
    var d = new Date(new Date(iso).getTime() + 8 * 3600 * 1000);
    return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
  }
  function newToken(){
    var s = '';
    if(window.crypto && crypto.getRandomValues){
      var a = new Uint8Array(10);
      crypto.getRandomValues(a);
      s = Array.prototype.map.call(a, function(b){ return ('0' + b.toString(36)).slice(-2); }).join('');
    } else { s = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); }
    return s.slice(0, 16);
  }
  function getMy(){ try { return localStorage.getItem('moguo_my_id') || ''; } catch(e){ return ''; } }
  function setMy(v){ try { localStorage.setItem('moguo_my_id', v); } catch(e){} }
  function clearMy(){ try { localStorage.removeItem('moguo_my_id'); } catch(e){} }
  function isMine(m){ var my = getMy(); return !!my && !!m && String(m.id) === my; }
  function shareUrl(){
    var u = new URL(window.location.href);
    u.hash = '';
    ['u','admin','id','name'].forEach(function(k){ u.searchParams.delete(k); });
    return u.toString();
  }
  function copyFallback(x){
    var ta = document.createElement('textarea');
    ta.value = x;
    ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return ok;
  }
  function copy(t){
    return new Promise(function(res){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){ res(true); }, function(){ res(copyFallback(t)); });
      } else { res(copyFallback(t)); }
    });
  }
  function toast(msg){
    var el = document.getElementById('toast');
    if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('show'); }, 1900);
  }
  function errCard(msg){
    return '<div class="card center"><div class="erricon">!</div><h1 style="font-size:17px">' + esc(msg) + '</h1><p class="hint">下拉刷新重试；仍不行请联系管理员。</p></div>';
  }
  async function q(p){
    var r = await p;
    if(r && r.error) throw new Error(r.error.message || '请求失败，请重试');
    return r ? r.data : null;
  }

  function loadScript(src, ok, bad){
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = bad;
    document.head.appendChild(s);
  }
  function start(){
    if(CFG.backend === 'supabase'){
      if(!window.SupabaseDB || !CFG.supabaseUrl || !CFG.supabaseKey){
        app.innerHTML = errCard('数据库配置缺失，请检查 supabaseUrl / supabaseKey'); return;
      }
      db = SupabaseDB.create(CFG.supabaseUrl, CFG.supabaseKey).database;
      return route();
    }
    if(!window.WorkBuddyCloud || !CFG.endpoint || !CFG.publishableKey){
      app.innerHTML = errCard('登记组件加载失败，请刷新重试'); return;
    }
    db = WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: CFG.endpoint,
      oauthRelayBaseUrl: CFG.oauthRelayBaseUrl,
      publishableKey: CFG.publishableKey
    }).database;
    route();
  }
  function init(){
    if(CFG.backend === 'supabase'){
      return loadScript('./supabase-db.js', start, function(){
        app.innerHTML = errCard('数据组件加载失败，请刷新重试');
      });
    }
    if(window.WorkBuddyCloud) return start();
    var sc = new URLSearchParams(location.search).get('sharecode');
    var local = './cloud-sdk.js' + (sc ? '?sharecode=' + encodeURIComponent(sc) : '');
    var cdn1 = 'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
    var cdn2 = 'https://unpkg.com/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
    loadScript(local, start, function(){
      loadScript(cdn1, start, function(){
        loadScript(cdn2, start, function(){ app.innerHTML = errCard('登记组件加载失败，请检查网络后刷新重试'); });
      });
    });
  }
  function route(){
    var p = new URLSearchParams(location.search);
    isAdmin = !!(CFG.adminKey && p.get('admin') === CFG.adminKey);
    state.day = today();
    if(isAdmin) adminView(); else memberView();
    autoCleanup();
  }

  var CACHE_KEY = 'moguo_last_data';
  async function loadData(day){
    // 4 个请求各自兜底：单个失败不拖垮全部，尽量用缓存补齐。
    // 名单/兑换码跨天不变，任意日期的缓存都能用；登记记录只认同一天。
    var cache = null;
    try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
    var sameDay = !!(cache && cache.day === day);
    var jobs = [
      q(db.from('members').select('*').order('id', { ascending: true })),
      q(db.from('checkins').select('*').eq('day', day)),
      q(db.from('plantings').select('*').eq('day', day)),
      q(db.from('codes').select('*').order('id', { ascending: false }))
    ];
    var fallbacks = [
      cache ? cache.members : null,
      sameDay ? cache.rows : null,
      sameDay ? cache.plants : null,
      cache ? cache.codes : null
    ];
    var okCount = 0;
    var results = await Promise.all(jobs.map(function(p, i){
      return p.then(function(d){ okCount++; return d; }, function(){ return fallbacks[i]; });
    }));
    state.members = results[0] || fallbacks[0] || [];
    state.rows    = results[1] || fallbacks[1] || [];
    state.plants  = results[2] || fallbacks[2] || [];
    state.codes   = results[3] || fallbacks[3] || [];
    state.day = day;
    if(okCount === jobs.length){
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          day: day, members: state.members, rows: state.rows, plants: state.plants, codes: state.codes
        }));
      } catch(e){}
    }
    // 全部失败且连名单都没有，才抛错让上层提示
    if(okCount === 0 && !state.members.length){
      throw new Error('网络连接失败，请重试');
    }
  }
  function compute(){
    var map = {}, plantMap = {};
    state.rows.forEach(function(r){ map[r.member_id] = r; });
    state.plants.forEach(function(r){ plantMap[r.member_id] = r; });
    var full = 0, none = 0, pending = [], plantNeed = 0, plantDone = 0;
    state.members.forEach(function(m){
      var r = map[m.id];
      if(r && r.status === 'full') full++;
      else { none++; pending.push(m); }
      if(m.need_plant){
        plantNeed++;
        var p = plantMap[m.id];
        if(p && p.status === 'done') plantDone++;
      }
    });
    return { map: map, plantMap: plantMap, full: full, none: none, pending: pending,
             total: state.members.length, plantNeed: plantNeed, plantDone: plantDone };
  }
  function comboState(m, c){
    var r = c.map[m.id], p = c.plantMap[m.id];
    var pickDone = !!(r && r.status === 'full');
    var plantDone = !m.need_plant || !!(p && p.status === 'done');
    var allDone = pickDone && plantDone;
    var allTodo = !pickDone && !plantDone;
    var cls = allDone ? ' c-all-done' : allTodo ? ' c-all-todo' : (!pickDone ? ' c-none' : '');
    return { cls: cls, allDone: allDone, allTodo: allTodo };
  }
  // 排序键：先按摸果（没摸到 → 已摸满），再按种果（未种 → 没有种果项 → 已种）
  // 保证「长得一样」的卡片一定连在一起
  function comboRank(m, c){
    var r = c.map[m.id], p = c.plantMap[m.id];
    var picked = !!(r && r.status === 'full');
    var plantState = !m.need_plant ? 1 : ((p && p.status === 'done') ? 2 : 0);
    return (picked ? 3 : 0) + plantState;
  }
  function sortMembers(arr, c, myId){
    return arr.slice().sort(function(a, b){
      if(myId){
        if(String(a.id) === myId) return -1;
        if(String(b.id) === myId) return 1;
      }
      var ra = comboRank(a, c), rb = comboRank(b, c);
      if(ra !== rb) return ra - rb;
      return a.id - b.id;
    });
  }
  async function setStatus(m, day, status){
    var exist = await q(db.from('checkins').select('*').eq('member_id', m.id).eq('day', day).maybeSingle());
    if(exist){
      var up = await q(db.from('checkins').update({
        status: status, member_name: m.name, updated_at: new Date().toISOString()
      }).eq('id', exist.id).select());
      if(!up || !up.length) throw new Error('登记未生效，请再点一次');
    } else {
      var ins = await q(db.from('checkins').insert({
        member_id: m.id, member_name: m.name, day: day, status: status
      }).select());
      if(!ins || !ins.length) throw new Error('登记未生效，请再点一次');
    }
  }
  async function setPlant(m, day, status){
    var exist = await q(db.from('plantings').select('*').eq('member_id', m.id).eq('day', day).maybeSingle());
    if(exist){
      var up = await q(db.from('plantings').update({
        status: status, updated_at: new Date().toISOString()
      }).eq('id', exist.id).select());
      if(!up || !up.length) throw new Error('种果登记未生效，请再点一次');
    } else {
      var ins = await q(db.from('plantings').insert({
        member_id: m.id, day: day, status: status
      }).select());
      if(!ins || !ins.length) throw new Error('种果登记未生效，请再点一次');
    }
  }
  async function refresh(){
    try { await loadData(state.day); }
    catch(e){ toast('读取失败：' + e.message); return; }
    updateStats();
    if(isAdmin) renderAdminList(); else renderMemberList();
    renderCodes();
  }
  function updateStats(){
    var c = compute();
    var pct = c.total ? Math.round(c.full * 100 / c.total) : 0;
    var st = document.getElementById('stats');

  function cssVar(n, fb){
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      return v || fb;
    } catch(e){ return fb; }
  }
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  function fitText(ctx, text, maxW){
    var t = String(text);
    if(ctx.measureText(t).width <= maxW) return t;
    while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }
  function buildShot(){
    var c = compute();
    var CP = {
      pick: cssVar('--c-pick-done', '#2E9E6B'),
      plantDone: cssVar('--c-plant-done', '#6B46C1'),
      doneBg: cssVar('--c-done-bg', '#EAF7F0'), doneBd: cssVar('--c-done-bd', '#8FD3AE'),
      todoBg: cssVar('--c-todo-bg', '#FDF0F0'), todoBd: cssVar('--c-todo-bd', '#EDA9A9'),
      noneBg: cssVar('--c-none-bg', '#FFFAF4'), noneBd: cssVar('--c-none-bd', '#EFD6B8'),
      warn: cssVar('--warn', '#B4692C'), muted: cssVar('--muted', '#718077'),
      ink: cssVar('--ink', '#20302A'), bg: cssVar('--bg', '#F5F7F2')
    };
    var arr = sortMembers(state.members, c, '');
    var W = 720, pad = 24, cols = 5, gap = 10, cellH = 84;
    var cellW = (W - pad * 2 - gap * (cols - 1)) / cols;
    var rows = Math.max(1, Math.ceil(arr.length / cols));
    var headH = 120, footH = 56;
    var H = headH + rows * (cellH + gap) + footH;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cv = document.createElement('canvas');
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = CP.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = CP.ink;
    ctx.font = '600 24px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('果子登记 · ' + prettyDay(state.day), pad, 42);
    ctx.font = '14px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = CP.muted;
    var line = state.day + '　已摸满 ' + c.full + '　没摸到 ' + c.none;
    if(c.plantNeed) line += '　种果 ' + c.plantDone + '/' + c.plantNeed;
    ctx.fillText(line, pad, 70);
    ctx.fillText('底色区分完成度，卡片内文字标注摸果/种果状态', pad, 94);
    arr.forEach(function(m, i){
      var x = pad + (i % cols) * (cellW + gap);
      var y = headH + Math.floor(i / cols) * (cellH + gap);
      var combo = comboState(m, c);
      var bg = '#FFFFFF', bd = '#E5EAE0';
      if(combo.cls.indexOf('c-all-done') >= 0){ bg = CP.doneBg; bd = CP.doneBd; }
      else if(combo.cls.indexOf('c-all-todo') >= 0){ bg = CP.todoBg; bd = CP.todoBd; }
      else if(combo.cls.indexOf('c-none') >= 0){ bg = CP.noneBg; bd = CP.noneBd; }
      ctx.fillStyle = bg; ctx.strokeStyle = bd; ctx.lineWidth = 1;
      roundRect(ctx, x, y, cellW, cellH, 10);
      ctx.fill(); ctx.stroke();
      var r = c.map[m.id], p = c.plantMap[m.id];
      ctx.fillStyle = CP.ink;
      ctx.font = '600 15px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(fitText(ctx, m.name, cellW - 20), x + 10, y + 24);
      ctx.font = '12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = (r && r.status === 'full') ? CP.pick : CP.warn;
      ctx.fillText(r && r.status === 'full' ? '摸果 已摸满' : '摸果 没摸到', x + 10, y + 46);
      if(m.need_plant){
        var done = p && p.status === 'done';
        ctx.fillStyle = done ? CP.plantDone : CP.muted;
        ctx.fillText(done ? '种果 已种果' : '种果 未种', x + 10, y + 66);
      }
    });
    ctx.fillStyle = CP.muted;
    ctx.font = '12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('生成时间 ' + new Date().toLocaleString('zh-CN', { hour12: false }) + '　共 ' + c.total + ' 人', pad, H - 20);
    return cv.toDataURL('image/png');
  }

                : '<span class="badge warn">没摸到</span>';
      var pstate = !m.need_plant ? '不显示'
                 : (p && p.status === 'done') ? '已种' : '未种';
      var combo = comboState(m, c);
      html += '<div class="arow' + (sel ? ' sel' : '') + combo.cls + '">' +
        '<div class="mrow"><label class="chk"><input type="checkbox" data-sel="' + m.id + '"' + (sel ? ' checked' : '') + '>选</label>' + badge + '</div>' +
        '<div class="mname">' + esc(m.name) + '</div>' +
        '<div class="psec"><span class="plabel">种果 ' + pstate + '</span>' +
        '<button class="mini" data-plant-toggle="' + m.id + '" style="padding:4px 8px">' + (m.need_plant ? '关闭' : '开启') + '</button></div>' +
        '<div class="mactions"><button class="mini" data-edit="' + m.id + '">编辑</button>' +
        '<button class="mini" data-del="' + m.id + '">删除</button></div></div>';
    });
    box.innerHTML = html || '<div class="hint" style="padding:14px 0">没有成员，先在上面添加。</div>';
    updateSelCount();
  }
  function adminListSelect(ev){
    var t = ev.target;
    if(!t || !t.dataset || !t.dataset.sel) return;
    selected[t.dataset.sel] = !!t.checked;
    var row = t.closest('.arow');
    if(row) row.classList.toggle('sel', !!t.checked);
    updateSelCount();
  }
  function selectAllVisible(){
    visibleMembers().forEach(function(m){ selected[m.id] = true; });
    renderAdminList();
  }
  async function bulkMarkFull(){
    var ids = chosenIds();
    if(!ids.length){ toast('先勾选成员'); return; }
    if(!window.confirm('把选中的 ' + ids.length + ' 人全部标记为「摸满了」？')) return;
    var btn = document.getElementById('btnBulkFull');
    btn.disabled = true;
    try {
      for(var i = 0; i < ids.length; i += 6){
        await Promise.all(ids.slice(i, i + 6).map(function(id){
          var m = state.members.filter(function(x){ return x.id === id; })[0];
          return m ? setStatus(m, state.day, 'full') : Promise.resolve();
        }));
      }
      toast('已标记 ' + ids.length + ' 人');
      refresh();
    } catch(e){ toast(e.message || '操作失败'); }
    finally { btn.disabled = false; }
  }
  async function bulkPlant(on){
    var ids = chosenIds();
    if(!ids.length){ toast('先勾选成员'); return; }
    var btn = document.getElementById(on ? 'btnBulkPlantOn' : 'btnBulkPlantOff');
    btn.disabled = true;
    try {
      for(var i = 0; i < ids.length; i += 6){
        var res = await Promise.all(ids.slice(i, i + 6).map(function(id){
          return q(db.from('members').update({ need_plant: on }).eq('id', id).select());
        }));
        if(res.some(function(r){ return !r || !r.length; })) throw new Error('部分成员未生效，请刷新核对');
      }
      toast('已' + (on ? '开启' : '关闭') + ' ' + ids.length + ' 人的种果');
      refresh();
    } catch(e){ toast(e.message || '操作失败'); }
    finally { btn.disabled = false; }
  }
  async function bulkDelete(){
    var ids = chosenIds();
    if(!ids.length){ toast('先勾选成员'); return; }
    if(!window.confirm('确定删除选中的 ' + ids.length + ' 人？他们的登记记录也会一起删除，不可恢复。')) return;
    var btn = document.getElementById('btnBulkDel');
    btn.disabled = true;
    try {
      for(var i = 0; i < ids.length; i += 6){
        var res = await Promise.all(ids.slice(i, i + 6).map(function(id){
          return q(db.from('members').delete().eq('id', id).select());
        }));
        if(res.some(function(r){ return !r || !r.length; })) throw new Error('部分成员删除失败，请刷新核对');
      }
      if(getMy() && ids.indexOf(Number(getMy())) >= 0) clearMy();
      selected = {};
      toast('已删除 ' + ids.length + ' 人');
      refresh();
    } catch(e){ toast(e.message || '删除失败，请刷新核对'); }
    finally { btn.disabled = false; }
  }
  async function addOne(){
    var nameEl = document.getElementById('newName');
    var name = nameEl.value.trim();
    if(!name){ toast('先填名字'); return; }
    if(state.members.some(function(m){ return m.name === name; })){ toast('这个名字已经有了'); return; }
    var btn = document.getElementById('btnAddOne');
    btn.disabled = true;
    try {
      var added = await q(db.from('members').insert({ name: name, token: newToken(), active: true }).select());
      if(!added || !added.length) throw new Error('添加未生效');
      nameEl.value = '';
      toast('已添加 ' + name);
      refresh();
    } catch(e){ toast(e.message || '添加失败'); }
    finally { btn.disabled = false; }
  }
  async function addBulk(){
    var box = document.getElementById('bulk');
    var names = box.value.split(/[\n,，、;；\t]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(!names.length){ toast('先填名单，每行一个名字'); return; }
    var byName = {};
    state.members.forEach(function(m){ byName[m.name] = true; });
    var rows = [], fresh = {};
    names.forEach(function(n){
      if(!byName[n] && !fresh[n]){
        fresh[n] = true;
        rows.push({ name: n, token: newToken(), active: true });
      }
    });
    if(!rows.length){ toast('这些名字都已经有了'); return; }
    var btn = document.getElementById('btnBulk');
    btn.disabled = true;
    try {
      var added = await q(db.from('members').insert(rows).select());
      if(!added || !added.length) throw new Error('添加未生效');
      box.value = '';
      toast('已添加 ' + rows.length + ' 人');
      refresh();
    } catch(e){ toast(e.message || '添加失败'); }
    finally { btn.disabled = false; }
  }
  async function adminListAction(ev){
    var btn = ev.target.closest('button');
    if(!btn) return;
    var ds = btn.dataset;
    var id = Number(ds.edit || ds.del || ds.plantToggle);
    var m = state.members.filter(function(x){ return x.id === id; })[0];
    if(!m) return;
    try {
      if(ds.plantToggle){
        var t = await q(db.from('members').update({ need_plant: !m.need_plant }).eq('id', id).select());
        if(!t || !t.length) throw new Error('修改未生效');
        toast(m.need_plant ? '已关闭 ' + m.name + ' 的种果' : '已开启 ' + m.name + ' 的种果');
        refresh();
        return;
      }
      if(ds.edit){
        var v = window.prompt('修改名字', m.name);
        if(v === null) return;
        var name = v.trim();
        if(!name){ toast('名字不能为空'); return; }
        var up = await q(db.from('members').update({ name: name }).eq('id', id).select());
        if(!up || !up.length) throw new Error('修改未生效');
        toast('已保存');
        refresh();
        return;
      }
      if(ds.del){
        if(!window.confirm('确定删除「' + m.name + '」？他的所有登记记录也会一起删除，不可恢复。')) return;
        var d = await q(db.from('members').delete().eq('id', id).select());
        if(!d || !d.length) throw new Error('删除未生效');
        if(getMy() === String(id)) clearMy();
        delete selected[id];
        toast('已删除 ' + m.name);
        refresh();
      }
    } catch(e){ toast(e.message || '操作失败，请重试'); }
  }

  init();
})();
</script>
</body>
</html>
